app = "wedly"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "php /app/artisan migrate --force"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
